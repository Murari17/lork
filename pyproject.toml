[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lork"
version = "0.2.0"
description = "Open-source LoRA fine-tuning service with low-level async execution primitives."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Murari" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.scripts]
lork = "lork.cli:main"

[project.urls]
Homepage = "https://github.com/Murari17/lork"
Repository = "https://github.com/Murari17/lork"
Documentation = "https://github.com/Murari17/lork/tree/main/docs"

[project.optional-dependencies]
server = [
    "accelerate>=0.34.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "peft>=0.13.0,<1.0.0",
    "safetensors>=0.4.5,<1.0.0",
    "torch>=2.3.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "transformers>=4.46.0,<6.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]
dev = [
    "build>=1.2.0,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "mypy>=1.11.0,<3.0.0",
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lork = ["py.typed"]
"lork.client" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["lork"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: slow integration or RL tests",
    "gpu: CUDA GPU tests (skipped when CUDA is unavailable)",
]
