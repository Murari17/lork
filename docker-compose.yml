services:
  dado:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DADO_API_KEYS: "${DADO_API_KEYS:?DADO_API_KEYS must be set}"
      DADO_DEVICE: "${DADO_DEVICE:-cuda}"
      DADO_MAX_SESSIONS: "${DADO_MAX_SESSIONS:-2}"
      DADO_SESSION_IDLE_TTL_SECONDS: "${DADO_SESSION_IDLE_TTL_SECONDS:-1800}"
      DADO_CHECKPOINT_ROOT: "/data/checkpoints"
      HF_HOME: "/cache/huggingface"
    volumes:
      - hf_cache:/cache/huggingface
      - checkpoints:/data/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hf_cache:
  checkpoints:
