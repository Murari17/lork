[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "loraforge"
version = "0.1.0"
description = "Open-source LoRA fine-tuning service with low-level async execution primitives."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "loraforge contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "certifi==2026.11.20",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "pydantic==2.14.4",
    "pydantic-core==2.50.5",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
]

[project.urls]
Homepage = "https://github.com/loraforge/loraforge"
Repository = "https://github.com/loraforge/loraforge"
Documentation = "https://github.com/loraforge/loraforge/tree/main/docs"

[project.optional-dependencies]
server = [
    "accelerate==1.16.0",
    "annotated-doc==0.0.7",
    "click==8.5.1",
    "fastapi==0.165.0",
    "filelock==4.3.0",
    "fsspec==2026.9.0",
    "hf-xet==1.8.0",
    "httpcore2==2.16.2",
    "httpx2==2.16.2",
    "huggingface-hub==2.4.0",
    "jinja2==3.1.6",
    "markdown-it-py==4.3.0",
    "markupsafe==3.0.4",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.4.6",
    "opentelemetry-api==1.45.2",
    "packaging==26.3",
    "peft==0.22.0",
    "psutil==7.2.2",
    "pygments==2.21.0",
    "pyyaml==6.0.4",
    "regex==2026.11.19",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "starlette==1.10.0",
    "sympy==1.14.0",
    "tokenizers==0.23.3",
    "torch==2.15.0",
    "tqdm==4.70.1",
    "transformers==5.24.0",
    "truststore==0.10.5",
    "typer==0.29.2",
    "uvicorn==0.54.0",
]
dev = [
    "ast-serialize==0.13.1",
    "build==1.6.1",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.68.0",
    "iniconfig==2.3.1",
    "kiwisolver==1.5.1",
    "librt==0.17.0",
    "matplotlib==3.11.2",
    "mypy==2.4.1",
    "mypy-extensions==1.2.0",
    "pathspec==1.1.1",
    "pillow==13.0.0",
    "pluggy==1.7.0",
    "pyparsing==3.3.3",
    "pyproject-hooks==1.3.3",
    "pytest==9.2.0",
    "python-dateutil==4.0.0",
    "ruff==0.17.6",
    "tzdata==2026.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loraforge = ["py.typed"]
"loraforge.client" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["loraforge"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: slow integration or RL tests",
    "gpu: CUDA GPU tests (skipped when CUDA is unavailable)",
]
