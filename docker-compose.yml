services:
  lork:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LORK_API_KEYS: "${LORK_API_KEYS:?LORK_API_KEYS must be set}"
      LORK_DEVICE: "${LORK_DEVICE:-cuda}"
      LORK_MAX_SESSIONS: "${LORK_MAX_SESSIONS:-2}"
      LORK_SESSION_IDLE_TTL_SECONDS: "${LORK_SESSION_IDLE_TTL_SECONDS:-1800}"
      LORK_CHECKPOINT_ROOT: "/data/checkpoints"
      HF_HOME: "/cache/huggingface"
    volumes:
      - hf_cache:/cache/huggingface
      - checkpoints:/data/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hf_cache:
  checkpoints:
